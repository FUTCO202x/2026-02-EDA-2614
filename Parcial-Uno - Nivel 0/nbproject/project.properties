# Java Source
src.dir=src

# Main class
main.class=App

# Build output
build.dir=build
build.classes.dir=${build.dir}/classes
dist.dir=dist
dist.jar=${dist.dir}/Parcial-Uno-Nivel-0.jar
jar.compress=false

# Compilation
javac.source=21
